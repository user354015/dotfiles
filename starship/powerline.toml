format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$php\
[->](fg:black bg:green)\
[](fg:green bg:none)$time\
\n[ > ](bold)"""

[directory]
style = "fg:black bg:blue"
format = "[ $path ]($style)[ ](fg:blue bg:green)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:white"
format = '[[ $symbol $branch ](fg:black bg:white)]($style)'

[git_status]
style = "bg:white"
format = '[[($all_status$ahead_behind )](fg:black bg:white)]($style)'

[nodejs]
symbol = ""
style = "bg:red"
format = '[[ $symbol ($version) ](fg:black bg:red)]($style)'

[rust]
symbol = ""
style = "bg:red"
format = '[[ $symbol ($version) ](fg:black bg:red)]($style)'

[golang]
symbol = ""
style = "bg:red"
format = '[[ $symbol ($version) ](fg:black bg:red)]($style)'

[php]
symbol = ""
style = "bg:red"
format = '[[ $symbol ($version) ](fg:black bg:red)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:none bg:#1d2230)]($style)'

